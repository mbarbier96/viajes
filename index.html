<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Viajes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: hsl(230 33% 98%);
    --ink: hsl(222 47% 11%);
    --muted: hsl(220 9% 46%);
    --line: hsl(220 13% 91%);
    --card: #ffffff;
    --brand: hsl(237 87% 59%);
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); background: var(--bg);
    font-family: Geist, Inter, sans-serif; line-height: 1.5;
  }
  main { width: min(720px, calc(100% - 48px)); margin: 48px auto 64px; }
  h1 { font-size: 40px; letter-spacing: -0.03em; margin: 0 0 8px; font-weight: 600; }
  p { color: var(--muted); margin: 0 0 24px; }
  .list { display: grid; gap: 12px; }
  a.trip {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 22px; box-shadow: var(--shadow);
  }
  a.trip strong { display: block; font-size: 22px; letter-spacing: -0.02em; }
  a.trip span { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Viajes</h1>
  <p>Elige un destino.</p>
  <div class="list">
    <a class="trip" href="cancun/">
      <strong>Cancún</strong>
      <span>Hoteles en familia</span>
    </a>
  </div>
</main>
</body>
</html>
