<html lang="es-MX">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cancún 2027 · hoteles en familia</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: hsl(230 33% 98%);
    --ink: hsl(222 47% 11%);
    --muted: hsl(220 9% 46%);
    --line: hsl(220 13% 91%);
    --card: #ffffff;
    --soft: hsl(228 30% 96%);
    --brand: hsl(237 87% 59%);
    --brand-soft: hsl(238 90% 96%);
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.06);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; color: var(--ink); background: var(--bg);
    font-family: Geist, Inter, sans-serif; line-height: 1.5;
  }
  button, a { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3 { font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .wrap { width: min(1280px, calc(100% - 48px)); margin: 0 auto; }
  .top {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 56px; }
  .word {
    border: 0; background: none; padding: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.02em;
  }
  #who {
    color: var(--muted); font-size: 14px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
  }
  .who-name { white-space: nowrap; }
  .who-tools { display: flex; align-items: center; gap: 8px; }
  .switch {
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 500;
    box-shadow: 0 1px 2px rgba(10, 13, 13, 0.04);
  }
  .more { position: relative; }
  .menu {
    display: none; position: absolute; right: 0; top: calc(100% + 8px); width: min(320px, 86vw);
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); padding: 8px; z-index: 30;
  }
  .menu.open { display: grid; gap: 2px; }
  .menu button {
    border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 10px;
    font-size: 14px; font-weight: 500; color: var(--ink);
  }
  .menu button:hover, .menu button.on { background: var(--brand-soft); color: var(--brand); }
  .menu em { font-style: normal; color: var(--muted); font-size: 12px; margin-left: 8px; }
  .menu .sep { height: 1px; background: var(--line); margin: 6px 8px; }
  .sheet { animation: rise 0.35s ease both; padding-bottom: 48px; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .intro { padding: 36px 0 16px; max-width: 68ch; color: var(--muted); }
  .intro h1 { color: var(--ink); font-size: clamp(32px, 4vw, 44px); line-height: 1.1; margin-bottom: 12px; }
  .gate {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    padding: 28px 0 48px;
  }
  .gate button {
    border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    border-radius: 16px; background: var(--card); text-align: left; padding: 0;
    overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
  }
  .gate .shot { display: block; height: min(52vh, 460px); background: var(--soft) center 22% / cover no-repeat; }
  .gate .copy { padding: 20px 22px 24px; }
  .gate em { font-style: normal; color: var(--brand); font-size: 13px; font-weight: 600; }
  .gate h1 { font-size: clamp(32px, 4vw, 44px); line-height: 1.05; margin-top: 6px; }
  .gate p { color: var(--muted); margin: 10px 0 0; }
  .trips { display: grid; gap: 16px; }
  .trip {
    display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start;
    background: var(--card); border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    border-radius: 16px; padding: 10px; box-shadow: var(--shadow);
  }
  .trip img { width: 240px; height: 180px; object-fit: cover; display: block; border-radius: 12px; }
  .rates { margin-top: 14px; }
  .rate {
    display: grid; grid-template-columns: 7.5rem 1fr; gap: 12px 16px; align-items: baseline;
    padding: 8px 0; border-top: 1px solid var(--line);
  }
  .rate strong { font-size: 18px; letter-spacing: -0.03em; }
  .rate span { color: var(--muted); font-size: 14px; }
  .occ { display: block; margin-top: 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .why {
    display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: end;
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .scores { display: flex; gap: 18px; }
  .score i { display: block; font-style: normal; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .dots { display: flex; gap: 4px; margin-top: 8px; }
  .dots span { width: 11px; height: 11px; border-radius: 50%; background: var(--soft); }
  .dots span.on { background: var(--brand); }
  .ages { display: grid; gap: 6px; width: 220px; }
  .ages-track { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .ages-track span {
    text-align: center; font-size: 11px; font-weight: 600; padding: 7px 0; border-radius: 8px;
    background: var(--soft); color: var(--muted);
  }
  .ages-track span.you { background: var(--brand); color: white; }
  .ages-track span.club { background: var(--brand-soft); color: var(--brand); }
  .ages small, .shape small { color: var(--muted); font-size: 12px; }
  .shape { display: grid; gap: 4px; width: 168px; }
  .spark { display: block; width: 100%; height: 36px; }
  .spark polyline { fill: none; stroke: var(--brand); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .spark circle { fill: var(--brand); }
  .mark {
    display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 600;
    color: var(--ink); background: var(--soft); border-radius: 999px; padding: 4px 10px;
  }
  .kicker { color: var(--brand); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .kid {
    display: inline-block; margin-top: 8px; color: var(--brand); font-size: 13px; font-weight: 600;
    background: var(--brand-soft); border-radius: 999px; padding: 4px 10px;
  }
  .muted { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .price { font-size: 28px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .go, .ghost {
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    height: 40px; padding: 0 14px; font-size: 14px; font-weight: 500; border-radius: 8px; border: 0;
  }
  .go { background: var(--brand); color: white; cursor: pointer; }
  .shot { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 12px; }
  .ghost { border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .frame {
    position: relative; margin-top: 20px; background: var(--soft);
    aspect-ratio: 2.15 / 1; overflow: hidden; border-radius: 16px;
    border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    box-shadow: var(--shadow);
  }
  .frame .slide {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 0.35s ease;
  }
  .frame .slide.on { opacity: 1; }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 999px;
    background: white; color: var(--ink); font-size: 22px; line-height: 1;
    box-shadow: var(--shadow);
  }
  .nav.prev { left: 14px; }
  .nav.next { right: 14px; }
  .count, .caption {
    position: absolute; z-index: 3; background: white; color: var(--ink);
    border-radius: 10px; padding: 6px 10px; font-size: 13px; box-shadow: var(--shadow);
  }
  .count { right: 16px; bottom: 14px; color: var(--muted); }
  .caption { left: 16px; bottom: 14px; max-width: min(62ch, 70%); }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; }
  .strip button {
    border: 2px solid transparent; padding: 0; background: var(--soft); flex: none;
    width: 92px; height: 64px; border-radius: 10px; overflow: hidden;
  }
  .strip button.on { border-color: var(--brand); }
  .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .head {
    background: var(--card); border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    border-radius: 16px; padding: 20px; margin-top: 12px; box-shadow: var(--shadow);
  }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .fact {
    background: var(--soft); border-radius: 999px; padding: 6px 10px;
    font-size: 13px; font-weight: 600;
  }
  .amenities { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .amenity {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--soft); border-radius: 999px; padding: 6px 10px; font-size: 13px; font-weight: 500;
  }
  .amenity svg { width: 16px; height: 16px; stroke: var(--brand); fill: none; stroke-width: 1.8; }
  .buy { text-align: left; }
  .stay { margin-top: 4px; font-weight: 600; }
  .below { display: grid; gap: 12px; margin-top: 12px; }
  .bookrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .panel {
    background: var(--card); border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    border-radius: 16px; padding: 16px 18px 18px; box-shadow: var(--shadow);
  }
  .months, .weeks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .months button, .weeks button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 8px 12px; font-weight: 500; font-size: 14px;
  }
  .months button { display: grid; gap: 2px; text-align: left; min-width: 7.5rem; }
  .months button em { font-style: normal; font-size: 12px; color: var(--muted); font-weight: 600; }
  .months button.on, .weeks button.on { background: var(--brand); color: white; border-color: var(--brand); }
  .months button.on em { color: color-mix(in srgb, white 78%, transparent); }
  .weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
  .weeks button { display: grid; gap: 2px; text-align: left; padding: 10px 12px; }
  .weeks button strong { font-size: 16px; letter-spacing: -0.03em; }
  .weeks button span { color: var(--muted); font-size: 13px; }
  .weeks button.on span { color: color-mix(in srgb, white 82%, transparent); }
  .weeks button.best:not(.on) { border-color: var(--brand); background: var(--brand-soft); }
  .sort { margin-top: 14px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
  .cal i, .cal b { text-align: center; font-style: normal; font-size: 13px; padding: 8px 0; border-radius: 8px; }
  .cal i { color: var(--muted); font-weight: 600; font-size: 11px; }
  .cal b.sat { cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; }
  .cal b.sat em { font-style: normal; font-size: 10px; font-weight: 600; color: var(--muted); }
  .cal b.cheap { background: var(--brand-soft); color: var(--brand); }
  .cal b.cheap em { color: var(--brand); }
  .cal b.dear { background: var(--soft); }
  .cal b.in { background: var(--brand-soft); color: var(--brand); }
  .cal b.edge { background: var(--brand); color: white; font-weight: 600; }
  .cal b.edge em { color: color-mix(in srgb, white 80%, transparent); }
  .map { width: 100%; height: 280px; border: 0; border-radius: 12px; display: block; margin-top: 10px; }
  .note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  footer { color: var(--muted); font-size: 13px; padding: 8px 0 36px; border-top: 1px solid var(--line); }
  @media (max-width: 800px) {
    .wrap { width: min(1280px, calc(100% - 32px)); }
    .trip, .gate, .bookrow { grid-template-columns: 1fr; }
    .trip img { width: 100%; height: 160px; }
    .buy, .actions { text-align: left; justify-content: flex-start; }
    .actions .go, .actions .ghost { width: 100%; }
    .frame { aspect-ratio: 16 / 10; }
    .caption { max-width: 78%; }
    .brand {
      display: grid; grid-template-columns: 1fr; gap: 10px;
      align-items: stretch; min-height: 0; padding: 12px 0;
    }
    #who { display: grid; gap: 8px; justify-content: stretch; }
    .who-name { white-space: normal; font-size: 13px; }
    .who-tools { display: grid; grid-template-columns: 1fr 1fr; }
    .switch { min-height: 44px; width: 100%; }
    .more { width: 100%; }
    .menu { left: 0; right: 0; width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .frame .slide { animation: none; transition: none; }
  }
</style>
</head>

function priceRows(h) {
  const groups = new Map();
  for (const day of WEEKS) {
    const n = h.prices[day];
    if (typeof n !== "number") continue;
    const key = String(n);
    if (!groups.has(key)) groups.set(key, { price: n, days: [] });
    groups.get(key).days.push(day);
  }
  return [...groups.values()].sort((a, b) => a.price - b.price);
}
function dateList(days) {
  if (days.length >= 4 && days.every((d, i) => i === 0 || addDays(days[i - 1], 7) === d)) {
    return `${stay(days[0]).split(" – ")[0]} al ${stay(days[days.length - 1]).split(" – ")[1]}`;
  }
  return days.map((d) => stay(d)).join(" · ");
}
function occLabel(h) {
  return h.pricedFor === "toddlers"
    ? "Tarifa para esta familia, en el sitio del hotel"
    : "Buscado con 7 y 10 años, no es la tarifa de esta familia";
}
function meters(h) {
  const s = SIGNALS[h.id];
  if (!s) return "";
  const dots = (n) => `<div class="dots">${[1, 2, 3, 4, 5].map((i) => `<span class="${i <= n ? "on" : ""}"></span>`).join("")}</div>`;
  const score = (label, n) => `<div class="score"><i>${label}</i>${dots(n)}</div>`;
  const you = party().id === "dfw" ? [1] : [1, 2];
  const ages = [0, 1, 2, 3, 4, 5].map((a) => {
    const cls = you.includes(a) ? "you" : a >= s.club ? "club" : "";
    return `<span class="${cls}">${a === 0 ? "<1" : a}</span>`;
  }).join("");
  const clubNote = s.mode === "drop"
    ? `Los dejan desde los ${s.club}`
    : s.mode === "parent"
      ? `Club desde ${s.club}; un papá se queda si son menores de 3`
      : `Club desde ${s.club}; se quedan contigo`;
  const vals = WEEKS.map((w) => h.prices[w]).filter((n) => typeof n === "number");
  let shape = "";
  if (vals.length > 1) {
    const min = Math.min(...vals), max = Math.max(...vals);
    const w = 220, hgt = 40, pad = 4;
    const pts = vals.map((v, i) => {
      const x = pad + (i / (vals.length - 1)) * (w - pad * 2);
      const y = hgt - pad - ((v - min) / (max - min || 1)) * (hgt - pad * 2);
      return `${x},${y}`;
    });
    const low = vals.indexOf(min);
    const [lx, ly] = pts[low].split(",");
    shape = `<div class="shape">
      <svg class="spark" viewBox="0 0 ${w} ${hgt}" aria-hidden="true">
        <polyline points="${pts.join(" ")}" />
        <circle cx="${lx}" cy="${ly}" r="3.5" />
      </svg>
      <small>Jul → sep · más barato ${money(min)}</small>
    </div>`;
  }
  return `<div class="why">
    <div class="scores">${score("Encaje", s.match)}${score("Huéspedes", s.guests)}${score("Bebés", s.toddlers)}</div>
    <div class="ages"><div class="ages-track">${ages}</div><small>${clubNote}</small></div>
    ${shape}
  </div>`;
}

  const search = `<a class="go" href="${h.book(day, out, p)}" target="_blank" rel="noreferrer">Buscar en el hotel</a>`;
  const flight = p.id === "juarez"
    ? `<a class="ghost" href="${viva(day, out, p)}" target="_blank" rel="noreferrer">Viva · Juárez</a>`
    : `<a class="ghost" href="${aa(day, out, p)}" target="_blank" rel="noreferrer">American · Dallas</a>`;
  return search + flight;
}

function toTop() {
  window.scrollTo({ top: 0, left: 0, behavior: "auto" });
}

function goTab(id) {
  state.tab = id;
  state.photo = 0;
  state.menu = false;
  if (id !== "overview") state.month = state.week[id].slice(0, 7);
  render();
  toTop();
}

function openHotel(id, day) {
  state.tab = id;
  state.photo = 0;
  state.week[id] = day;
  state.month = day.slice(0, 7);
  render();
  toTop();
}

function renderOverview() {
  const p = party();
  const ranked = HOTELS.filter((h) => h.rank).sort((a, b) => a.rank - b.rank);
  document.getElementById("view").innerHTML = `
    <section class="sheet">
      <div class="intro">
        <h1>Hoteles para ${p.names}.</h1>
      </div>
      <div class="trips">
        ${ranked.map((h) => {
          const rows = priceRows(h);
          const cheap = cheapest(h);
          const s = SIGNALS[h.id];
          return `<article class="trip">
            <button class="shot" type="button" data-jump="${h.id}|${cheap}"><img alt="${h.images[0].cap}" src="${h.images[0].src}" /></button>
            <div>
              <div class="kicker">${h.rank} · ${h.tier} · ${h.area}</div>
              <h2>${h.name}</h2>
              ${s ? `<span class="mark">${s.mark}</span>` : ""}
              ${meters(h)}
              <span class="occ">${occLabel(h)}</span>
              <div class="rates">
                ${rows.map((r) => `<div class="rate"><strong>${moneyExact(r.price)}</strong><span>${dateList(r.days)}</span></div>`).join("")}
              </div>
              <div class="actions"><button class="go" type="button" data-jump="${h.id}|${cheap}">Ver hotel</button></div>
            </div>
          </article>`;
        }).join("")}
      </div>
    </section>`;
  document.querySelectorAll("[data-jump]").forEach((btn) => btn.addEventListener("click", () => {
    const [id, day] = btn.dataset.jump.split("|");
    openHotel(id, day);
  }));
}

function weekPrice(h, w) {
  return typeof h.prices[w] === "number" ? h.prices[w] : Infinity;
}
function weeksByPrice(h, list = WEEKS) {
  return [...list].sort((a, b) => weekPrice(h, a) - weekPrice(h, b) || a.localeCompare(b));
}
function monthLow(h, id) {
  const nums = WEEKS.filter((w) => w.startsWith(id)).map((w) => h.prices[w]).filter((n) => typeof n === "number");
  return nums.length ? Math.min(...nums) : null;
}
function priceBand(h, w) {
  const priced = WEEKS.filter((d) => typeof h.prices[d] === "number").map((d) => h.prices[d]);
  if (!priced.length || typeof h.prices[w] !== "number") return "";
  const min = Math.min(...priced), max = Math.max(...priced);
  if (max === min) return "cheap";
  const t = (h.prices[w] - min) / (max - min);
  return t <= 0.2 ? "cheap" : t >= 0.7 ? "dear" : "";
}
function calendar(h) {
  const m = MONTHS.find((x) => x.id === state.month);
  const day = state.week[h.id];
  const out = addDays(day, 7);
  const first = new Date(m.year, m.month, 1);
  const count = new Date(m.year, m.month + 1, 0).getDate();
  const heads = ["D","L","M","M","J","V","S"].map((d) => `<i>${d}</i>`).join("");
  let cells = "";
  for (let i = 0; i < first.getDay(); i++) cells += "<b></b>";
  for (let n = 1; n <= count; n++) {
    const iso = `${m.id}-${String(n).padStart(2, "0")}`;
    const inRange = iso >= day && iso <= out && iso.slice(0, 7) === m.id;
    const sat = WEEKS.includes(iso);
    const cls = [sat ? "sat" : "", sat ? priceBand(h, iso) : "", inRange ? "in" : "", iso === day || iso === out ? "edge" : ""].filter(Boolean).join(" ");
    const tag = sat && typeof h.prices[iso] === "number" ? `<em>${money(h.prices[iso])}</em>` : "";
    cells += `<b class="${cls}" ${sat ? `data-week="${iso}"` : ""}>${n}${tag}</b>`;
  }
  return `<div class="cal">${heads}${cells}</div>`;
}

function renderHotel(h) {
  const day = state.week[h.id];
  const weeks = weeksByPrice(h, WEEKS.filter((w) => w.startsWith(state.month)));
  const cheap = weeks.find((w) => typeof h.prices[w] === "number");
  const facts = [
    h.score && h.score !== "—" ? `${h.score} / 5` : "",
    h.reviews,
    h.room,
    "7 noches"
  ].filter(Boolean);
  document.getElementById("view").innerHTML = `
    <section class="sheet">
      <div class="intro" style="padding:20px 0 0">
        <button class="switch" id="back" type="button">Volver al ranking</button>
      </div>
      <div class="frame" id="frame">
        ${h.images.map((img, i) => `<img class="slide ${i === state.photo ? "on" : ""}" alt="${img.cap}" src="${img.src}" />`).join("")}
        <button class="nav prev" type="button" data-dir="-1" aria-label="Foto anterior">‹</button>
        <button class="nav next" type="button" data-dir="1" aria-label="Foto siguiente">›</button>
        <div class="caption" id="caption">${h.images[state.photo].cap}</div>
        <div class="count" id="count">${state.photo + 1} / ${h.images.length}</div>
      </div>
      <div class="strip">
        ${h.images.map((img, i) => `<button type="button" data-photo="${i}" class="${i === state.photo ? "on" : ""}"><img alt="" src="${img.src}" /></button>`).join("")}
      </div>
      <div class="head">
        <div class="kicker">${h.tier} · ${h.area}</div>
        <h1>${h.name}</h1>
        <div class="facts">${facts.map((f) => `<span class="fact">${f}</span>`).join("")}</div>
        <div class="amenities">${h.amenities.map(([k, label]) => `<div class="amenity">${I[k]}<span>${label}</span></div>`).join("")}</div>
        ${h.kids?.fit ? `<div class="kid">${h.kids.fit}</div>` : ""}
      </div>
      <div class="below">
        <div class="panel">
          <div class="kicker">Elige las fechas</div>
          <div class="months">${MONTHS.map((m) => {
            const low = monthLow(h, m.id);
            return `<button type="button" data-month="${m.id}" class="${m.id === state.month ? "on" : ""}">${m.name}${low != null ? `<em>desde ${money(low)}</em>` : "<em>Sin precio</em>"}</button>`;
          }).join("")}</div>
          <div class="sort">Más barato → más caro</div>
          <div class="weeks">${weeks.map((w) => {
            const n = h.prices[w];
            const label = typeof n === "number" ? moneyExact(n) : rateLabel(h, w);
            return `<button type="button" data-week="${w}" class="${w === day ? "on" : ""} ${w === cheap ? "best" : ""}"><strong>${label}</strong><span>${stay(w)}${w === cheap ? " · más barato" : ""}</span></button>`;
          }).join("")}</div>
          ${calendar(h)}
          <p class="note">Solo se ven las semanas de este mes, de la más barata a la más cara. En el calendario, el azul más claro es la mejor tarifa del verano.</p>
        </div>
        <div class="bookrow">
          <div class="panel buy">
            <div class="kicker">Esta semana</div>
            <div class="price">${rateLabel(h, day)}</div>
            <div class="stay">${stay(day)}</div>
            <div class="muted">${h.room} · 7 noches</div>
            <div class="occ">${occLabel(h)}</div>
            <div class="actions">${links(h, day)}</div>
            ${h.searchNote ? `<p class="note">${h.searchNote}</p>` : ""}
          </div>
          <div class="panel">
            <div class="kicker">Ubicación</div>
            <div style="margin-top:6px;font-weight:600">${h.address}</div>
            <iframe class="map" title="Mapa de ${h.name}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${encodeURIComponent(h.map)}&z=14&output=embed"></iframe>
          </div>
        </div>
      </div>
    </section>`;

  document.getElementById("back").addEventListener("click", () => goTab("overview"));
  document.querySelectorAll("[data-month]").forEach((btn) => btn.addEventListener("click", () => {
    state.month = btn.dataset.month;
    if (!state.week[h.id].startsWith(state.month)) {
      const next = weeksByPrice(h, WEEKS.filter((w) => w.startsWith(state.month)))[0];
      if (next) state.week[h.id] = next;
    }
    renderHotel(h);
  }));
  document.querySelectorAll("[data-week]").forEach((btn) => btn.addEventListener("click", () => {
    state.week[h.id] = btn.dataset.week;
    state.month = btn.dataset.week.slice(0, 7);
    renderHotel(h);
  }));
  const show = (n) => {
    state.photo = (n + h.images.length) % h.images.length;
    document.querySelectorAll(".frame .slide").forEach((img, i) => img.classList.toggle("on", i === state.photo));
    document.querySelectorAll(".strip button").forEach((btn, i) => btn.classList.toggle("on", i === state.photo));
    const count = document.getElementById("count");
    if (count) count.textContent = `${state.photo + 1} / ${h.images.length}`;
    const caption = document.getElementById("caption");
    if (caption) caption.textContent = h.images[state.photo].cap;
    const active = document.querySelector(".strip button.on");
    if (active) active.scrollIntoView({ block: "nearest", inline: "nearest" });
  };
  const arm = () => {
    clearInterval(timer);
    timer = setInterval(() => { if (!document.hidden) show(state.photo + 1); }, 5000);
  };
  document.querySelectorAll("[data-dir]").forEach((btn) => btn.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
    show(state.photo + Number(btn.dataset.dir));
    arm();
  }));
  document.querySelectorAll("[data-photo]").forEach((btn) => btn.addEventListener("click", () => {
    show(Number(btn.dataset.photo));
    arm();
  }));
  arm();
}

function renderWho() {
  const who = document.getElementById("who");
  const home = document.getElementById("home");
  home.onclick = () => { if (state.family) goTab("overview"); };
  if (!state.family) {
    who.innerHTML = `<span class="who-name">Elige una familia</span>`;
    return;
  }
  const p = party();
  const listed = [...HOTELS].sort((a, b) => (a.rank || 99) - (b.rank || 99));
  const ranked = listed.filter((h) => h.rank);
  const rest = listed.filter((h) => !h.rank);
  const item = (h) => `<button type="button" data-go="${h.id}" class="${state.tab === h.id ? "on" : ""}">${h.tab || h.name.replace("Grand Fiesta Americana ", "")}<em>${h.tier}</em></button>`;
  who.innerHTML = `<span class="who-name">${p.names} · ${p.from}</span>
    <span class="who-tools">
      <button class="switch" id="switch" type="button">Cambiar familia</button>
      <span class="more">
        <button class="switch" id="hotels-btn" type="button" aria-expanded="${state.menu}">Todos los hoteles</button>
        <div class="menu ${state.menu ? "open" : ""}" id="hotel-menu">
          <button type="button" data-go="overview" class="${state.tab === "overview" ? "on" : ""}">Ranking</button>
          <div class="sep"></div>
          ${ranked.map(item).join("")}
          <div class="sep"></div>
          ${rest.map(item).join("")}
        </div>
      </span>
    </span>`;
  document.getElementById("switch").addEventListener("click", () => {
    state.family = null;
    state.menu = false;
    sessionStorage.removeItem("cancun-family");
    render();
  });
  document.getElementById("hotels-btn").addEventListener("click", (event) => {
    event.stopPropagation();
    state.menu = !state.menu;
    document.getElementById("hotel-menu").classList.toggle("open", state.menu);
    document.getElementById("hotels-btn").setAttribute("aria-expanded", String(state.menu));
  });
  document.querySelectorAll("#hotel-menu [data-go]").forEach((btn) => btn.addEventListener("click", () => goTab(btn.dataset.go)));
  document.onclick = (event) => {
    if (!event.target.closest(".more")) {
      state.menu = false;
      const menu = document.getElementById("hotel-menu");
      if (menu) menu.classList.remove("open");
    }
  };
}
function renderGate() {
  document.getElementById("view").innerHTML = `<section class="gate">${["juarez", "dfw"].map((id) => {
    const f = FAMILIES[id];
    return `<button type="button" data-family="${id}"><span class="shot" style="background-image:url('${f.shot}')"></span><div class="copy"><em>${f.size}</em><h1>${f.names}</h1><p>${f.from}<br>${f.airline}<br>${f.kidsLabel}</p></div></button>`;
  }).join("")}</section>`;
  document.querySelectorAll("[data-family]").forEach((btn) => btn.addEventListener("click", () => {
    state.family = btn.dataset.family;
    sessionStorage.setItem("cancun-family", state.family);
    state.tab = "overview";
    render();
  }));
  document.getElementById("foot").innerHTML = "";
}
function render() {
  renderWho();
  clearInterval(timer);
  if (!state.family || !FAMILIES[state.family]) {
    state.family = null;
    renderGate();
    return;
  }
  if (state.tab === "overview") renderOverview();
  else if (byId[state.tab]) renderHotel(byId[state.tab]);
  else { state.tab = "overview"; renderOverview(); }
  const p = party();
  document.getElementById("foot").innerHTML = `Para ${p.names}, ${p.size.toLowerCase()}. ${p.kidsDetail} Lindo y Maya reciben bebés: Star Camp Kangaroo es de 0 a 3 años, con un adulto. Iberostar Selection Coral Cancún y JOIA son solo para adultos. Grand Fiesta Americana Coral Beach no acepta menores de 5 años. Ninguno de esos tres está en la lista. Sin precio de vuelo. Septiembre es temporada de huracanes.`;
}
render();
</script>
